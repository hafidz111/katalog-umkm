<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6b4f">
  <title>Katalog sedang offline</title>
  <style>
    :root { --latar:#ffffff; --teks:#1b2420; --lembut:#5b6a62; --utama:#1f6b4f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--latar); color:var(--teks); font-family:system-ui,sans-serif; }
    main { max-width:40rem; margin:12vh auto; padding:1.5rem; }
    h1 { font-size:2rem; line-height:1.2; }
    p { color:var(--lembut); line-height:1.6; }
    a { display:inline-block; margin-top:1rem; padding:.8rem 1.25rem; border-radius:.5rem; color:white; background:var(--utama); text-decoration:none; font-weight:600; }
    a:focus-visible { outline:3px solid var(--utama); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <h1>Katalog sedang offline</h1>
    <p>Koneksi internet diperlukan untuk memuat katalog dan harga produk terbaru. Sambungkan kembali perangkat Anda, lalu coba lagi.</p>
    <a href="/">Coba lagi</a>
  </main>
</body>
</html>
